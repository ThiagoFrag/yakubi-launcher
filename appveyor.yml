version: "{build}"
image: Visual Studio 2022

clone_script:
  - cmd: git clone --recurse-submodules -j4 https://github.com/%APPVEYOR_REPO_NAME%.git %APPVEYOR_BUILD_FOLDER%
  - cmd: git -C %APPVEYOR_BUILD_FOLDER% checkout %APPVEYOR_REPO_BRANCH%

environment:
  MSYSTEM: CLANG64

install:
  - cmd: C:\msys64\usr\bin\bash -lc "pacman -Syu --noconfirm --needed 2>&1 | tail -3"
  - cmd: C:\msys64\usr\bin\bash -lc "pacman -S --noconfirm --needed mingw-w64-clang-x86_64-toolchain mingw-w64-clang-x86_64-cmake mingw-w64-clang-x86_64-ninja mingw-w64-clang-x86_64-extra-cmake-modules mingw-w64-clang-x86_64-qt6-base mingw-w64-clang-x86_64-qt6-svg mingw-w64-clang-x86_64-qt6-imageformats mingw-w64-clang-x86_64-qt6-networkauth mingw-w64-clang-x86_64-cmark mingw-w64-clang-x86_64-qrencode mingw-w64-clang-x86_64-tomlplusplus mingw-w64-clang-x86_64-libarchive zip 2>&1 | tail -5"

build_script:
  - cmd: C:\msys64\usr\bin\bash -lc "export PATH=/clang64/bin:/usr/bin:$PATH && cd $(cygpath '%APPVEYOR_BUILD_FOLDER%') && cmake --preset windows_mingw -DCMAKE_BUILD_TYPE=Release && cmake --build --preset windows_mingw --config Release --parallel $(nproc)"

after_build:
  - cmd: C:\msys64\usr\bin\bash -lc "export PATH=/clang64/bin:/usr/bin:$PATH && cd $(cygpath '%APPVEYOR_BUILD_FOLDER%') && mkdir -p dist && cp build/yakulauncher.exe dist/ && windeployqt6 --release --no-translations dist/yakulauncher.exe && zip -r YakubiLauncher-Windows.zip dist/"

artifacts:
  - path: YakubiLauncher-Windows.zip
    name: YakubiLauncher-Windows

# Publishes the Windows build as a GitHub Release when a git tag is pushed.
# Normal pushes to develop still build, but only tag pushes deploy.
# Before the first tagged release: create a GitHub PAT (scope: public_repo),
# encrypt it at https://ci.appveyor.com/tools/encrypt and paste below.
deploy:
  - provider: GitHub
    tag: $(APPVEYOR_REPO_TAG_NAME)
    release: Yakubi Launcher $(APPVEYOR_REPO_TAG_NAME)
    description: |
      ## Yakubi Launcher — Build do Windows

      **YakubiLauncher-Windows.zip** — versão portátil pro Windows (Qt6, 64-bit).

      ### Como usar
      1. Baixe e extraia o `.zip`
      2. Rode `yakulauncher.exe` (não precisa instalar)
      3. Crie sua conta em https://mc.lin.lgbt/web/registration e faça login no launcher
    auth_token:
      secure: REPLACE_WITH_APPVEYOR_ENCRYPTED_GITHUB_TOKEN
    artifact: YakubiLauncher-Windows
    draft: false
    prerelease: false
    force_update: true
    on:
      APPVEYOR_REPO_TAG: true
